<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Hệ Thống QLSV</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-8">
  <div class="max-w-4xl mx-auto">
    <div class="flex justify-between items-center bg-gray-800 p-6 rounded-2xl border border-gray-700 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-indigo-400">Admin Control Panel 👑</h1>
        <p id="admin-greeting" class="text-sm text-gray-400 mt-1">Đang tải...</p>
      </div>
      <button id="btn-logout" class="bg-red-600 hover:bg-red-500 px-4 py-2 rounded-lg font-medium text-sm transition">Đăng Xuất</button>
    </div>

    <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 w-full max-w-md">
      <h2 class="text-lg font-semibold mb-4 text-green-400">Tạo Tài Khoản Mới</h2>
      <form id="admin-form" class="space-y-4">
        
        <!-- Chọn Loại Tài Khoản -->
        <div>
          <label class="block text-sm font-medium mb-1 text-gray-300">Loại tài khoản</label>
          <select id="user-role" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
            <option value="sinh_vien">Tài Khoản Sinh Viên</option>
            <option value="admin">Tài Khoản Quản Trị (Admin)</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1 text-gray-300">Tên Đăng Nhập (MSV hoặc ID Admin)</label>
          <input type="text" id="user-id" required placeholder="Nhập ID..." class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
        </div>
        
        <div>
          <label class="block text-sm font-medium mb-1 text-gray-300">Mật khẩu thô</label>
          <input type="text" id="user-password" required placeholder="Nhập mật khẩu..." class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
        </div>
        
        <button type="submit" class="w-full bg-green-600 hover:bg-green-500 font-semibold py-2 rounded-lg transition mt-4">
          Tạo Tài Khoản
        </button>
        <div id="admin-msg" class="text-sm text-center mt-2 font-medium hidden"></div>
      </form>
    </div>
  </div>

  <script type="module">
    // Bảo vệ trang Admin: Đuổi về trang chủ nếu không phải admin
    const session = JSON.parse(localStorage.getItem('userSession'));
    if (!session || session.role !== 'admin') {
      window.location.href = 'index.html';
    } else {
      document.getElementById('admin-greeting').textContent = `Xin chào Quản trị viên: ${session.uid}`;
    }

    // Nút đăng xuất
    document.getElementById('btn-logout').addEventListener('click', () => {
      localStorage.removeItem('userSession');
      window.location.href = 'index.html';
    });

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const app = initializeApp({
      apiKey: "AIzaSyA6MzA5S1JxABA6PPsiH1dV_JjMpoqkxIM",
      authDomain: "quan-ly-sinh-vien-e3307.firebaseapp.com",
      projectId: "quan-ly-sinh-vien-e3307",
      storageBucket: "quan-ly-sinh-vien-e3307.firebasestorage.app"
    });
    const db = getFirestore(app);

    // Thuật toán Custom Hash (Base64 -> Homoglyph -> SHA-256)
    const map = {'A':'А','B':'В','C':'С','E':'Е','H':'Н','I':'І','J':'Ј','K':'К','M':'М','O':'О','P':'Р','T':'Т','X':'Х','Y':'Ү','a':'а','b':'Ь','c':'с','d':'ԁ','e':'е','f':'𝚏','g':'ɡ','h':'һ','i':'і','j':'ϳ','k':'κ','l':'ⅼ','m':'ｍ','n':'ո','o':'о','p':'р','q':'ԛ','r':'г','s':'ѕ','t':'𝚝','u':'ս','v':'ѵ','w':'ѡ','x':'х','y':'у','z':'z','0':'૦','1':'١','2':'𝟐','3':'𝟯','4':'𝟺','5':'５','6':'б','7':'7','8':'8','9':'9','+':'➕','/':'⧸','=':'🟰'};
    async function processCustomPassword(pw) {
      const base64 = btoa(unescape(encodeURIComponent(pw)));
      const obf = base64.split('').map(c => map[c] || c).join('');
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(obf));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Xử lý tạo tài khoản
    document.getElementById('admin-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const userId = document.getElementById('user-id').value.trim();
      const rawPassword = document.getElementById('user-password').value;
      const selectedRole = document.getElementById('user-role').value; // Lấy role từ select
      const msg = document.getElementById('admin-msg');

      try {
        const secureHash = await processCustomPassword(rawPassword);
        
        // Lưu vào Firestore
        await setDoc(doc(db, "users", userId), {
          msv: userId, // Dùng chung ID
          passwordHash: secureHash,
          role: selectedRole, // Lưu quyền (admin hoặc sinh_vien)
          createdAt: new Date().toISOString(),
          createdBy: session.uid // Lưu vết xem Admin nào tạo
        });
        
        const roleText = selectedRole === 'admin' ? 'Admin' : 'Sinh viên';
        msg.textContent = `Tạo thành công ${roleText}: ${userId}`; 
        msg.className = "text-sm text-center mt-3 text-green-400"; 
        msg.classList.remove('hidden');
        document.getElementById('admin-form').reset(); // Reset form
      } catch (error) {
        msg.textContent = "Lỗi tạo tài khoản!"; 
        msg.className = "text-sm text-center mt-3 text-red-400"; 
        msg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
