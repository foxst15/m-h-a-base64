<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Hệ Thống QLSV</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 md:p-8">
  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Header -->
    <div class="flex justify-between items-center bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-md">
      <div>
        <h1 class="text-2xl font-bold text-indigo-400">Admin Control Panel 👑</h1>
        <p id="admin-greeting" class="text-sm text-gray-400 mt-1">Đang tải...</p>
      </div>
      <button id="btn-logout" class="bg-red-600 hover:bg-red-500 px-4 py-2 rounded-lg font-medium text-sm transition shadow-lg">
        Đăng Xuất
      </button>
    </div>

    <!-- Main Content Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- CỘT TRÁI: FORM TẠO TÀI KHOẢN -->
      <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 h-fit shadow-md">
        <h2 class="text-lg font-semibold mb-4 text-green-400 border-b border-gray-700 pb-2">Tạo Tài Khoản Mới</h2>
        <form id="admin-form" class="space-y-4">
          
          <div>
            <label class="block text-sm font-medium mb-1 text-gray-300">Loại tài khoản</label>
            <select id="user-role" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 outline-none transition text-sm">
              <option value="sinh_vien">Tài Khoản Sinh Viên</option>
              <option value="admin">Tài Khoản Quản Trị (Admin)</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium mb-1 text-gray-300">Tên Đăng Nhập (MSV hoặc ID)</label>
            <input type="text" id="user-id" required placeholder="Ví dụ: DCT23AB..." class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 outline-none font-mono text-sm">
          </div>

          <!-- Ô nhập Lớp (Sẽ bị ẩn nếu chọn Role là Admin) -->
          <div id="class-container" class="transition-all duration-300">
            <label class="block text-sm font-medium mb-1 text-gray-300">Lớp Sinh Hoạt</label>
            <input type="text" id="user-class" placeholder="Ví dụ: DCT23A..." class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 outline-none font-mono text-sm">
          </div>
          
          <div>
            <label class="block text-sm font-medium mb-1 text-gray-300">Mật khẩu khởi tạo</label>
            <input type="text" id="user-password" required placeholder="Nhập mật khẩu..." class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 outline-none text-sm">
          </div>
          
          <button type="submit" class="w-full bg-green-600 hover:bg-green-500 font-semibold py-2.5 rounded-lg transition mt-4 text-sm shadow-lg">
            Khởi Tạo Tài Khoản
          </button>
          <div id="admin-msg" class="text-sm text-center mt-2 font-medium hidden"></div>
        </form>
      </div>

      <!-- CỘT PHẢI: QUẢN LÝ TÀI KHOẢN (2 BẢNG) -->
      <div class="lg:col-span-2 space-y-6">
        
        <!-- Khu vực điều khiển tải lại chung -->
        <div class="flex justify-end">
          <button id="btn-refresh" class="text-sm bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg border border-gray-600 transition flex items-center space-x-2">
            <span>🔄 Làm mới toàn bộ dữ liệu</span>
          </button>
        </div>

        <!-- BẢNG 1: DANH SÁCH SINH VIÊN -->
        <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-md">
          <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
            <h2 class="text-lg font-semibold text-blue-400">🎓 Danh Sách Sinh Viên</h2>
            <span id="count-sv" class="bg-blue-900 text-blue-200 text-xs px-2 py-1 rounded-full font-bold">0</span>
          </div>
          
          <div class="overflow-x-auto max-h-80 overflow-y-auto">
            <table class="w-full text-left border-collapse">
              <thead class="sticky top-0 bg-gray-800">
                <tr class="border-b border-gray-700 text-gray-400 text-sm">
                  <th class="py-3 px-2">MSV</th>
                  <th class="py-3 px-2">Lớp</th>
                  <th class="py-3 px-2">Ngày Tạo</th>
                  <th class="py-3 px-2 text-center w-24">Thao Tác</th>
                </tr>
              </thead>
              <tbody id="table-sv" class="divide-y divide-gray-700 text-sm">
                <tr><td colspan="4" class="text-center py-6 text-gray-500">Đang tải dữ liệu...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- BẢNG 2: DANH SÁCH ADMIN -->
        <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-md">
          <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
            <h2 class="text-lg font-semibold text-red-400">🛡️ Danh Sách Quản Trị Viên</h2>
            <span id="count-admin" class="bg-red-900 text-red-200 text-xs px-2 py-1 rounded-full font-bold">0</span>
          </div>
          
          <div class="overflow-x-auto max-h-60 overflow-y-auto">
            <table class="w-full text-left border-collapse">
              <thead class="sticky top-0 bg-gray-800">
                <tr class="border-b border-gray-700 text-gray-400 text-sm">
                  <th class="py-3 px-2">ID Admin</th>
                  <th class="py-3 px-2">Người Tạo</th>
                  <th class="py-3 px-2">Ngày Tạo</th>
                  <th class="py-3 px-2 text-center w-24">Thao Tác</th>
                </tr>
              </thead>
              <tbody id="table-admin" class="divide-y divide-gray-700 text-sm">
                <tr><td colspan="4" class="text-center py-6 text-gray-500">Đang tải dữ liệu...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div> <!-- Hết Cột Phải -->
    </div>
  </div>

  <script type="module">
    // 1. Kiểm tra Quyền Admin
    const session = JSON.parse(localStorage.getItem('userSession'));
    if (!session || session.role !== 'admin') {
      window.location.href = 'index.html';
    } else {
      document.getElementById('admin-greeting').textContent = `Xin chào Quản trị viên: ${session.uid}`;
    }

    document.getElementById('btn-logout').addEventListener('click', () => {
      localStorage.removeItem('userSession');
      window.location.href = 'index.html';
    });

    // 2. Cấu hình Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDocs, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const app = initializeApp({
      apiKey: "AIzaSyA6MzA5S1JxABA6PPsiH1dV_JjMpoqkxIM",
      authDomain: "quan-ly-sinh-vien-e3307.firebaseapp.com",
      projectId: "quan-ly-sinh-vien-e3307",
      storageBucket: "quan-ly-sinh-vien-e3307.firebasestorage.app"
    });
    const db = getFirestore(app);

    // Thuật toán Custom Hash
    const map = {'A':'А','B':'В','C':'С','E':'Е','H':'Н','I':'І','J':'Ј','K':'К','M':'М','O':'О','P':'Р','T':'Т','X':'Х','Y':'Ү','a':'а','b':'Ь','c':'с','d':'ԁ','e':'е','f':'𝚏','g':'ɡ','h':'һ','i':'і','j':'ϳ','k':'κ','l':'ⅼ','m':'ｍ','n':'ո','o':'о','p':'р','q':'ԛ','r':'г','s':'ѕ','t':'𝚝','u':'ս','v':'ѵ','w':'ѡ','x':'х','y':'у','z':'z','0':'૦','1':'١','2':'𝟐','3':'𝟯','4':'𝟺','5':'５','6':'б','7':'7','8':'8','9':'9','+':'➕','/':'⧸','=':'🟰'};
    async function processCustomPassword(pw) {
      const base64 = btoa(unescape(encodeURIComponent(pw)));
      const obf = base64.split('').map(c => map[c] || c).join('');
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(obf));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // 3. UI Logic: Ẩn/Hiện trường Lớp
    const roleSelect = document.getElementById('user-role');
    const classContainer = document.getElementById('class-container');
    const classInput = document.getElementById('user-class');
    
    roleSelect.addEventListener('change', (e) => {
      if(e.target.value === 'admin') {
        classContainer.classList.add('hidden');
        classInput.value = ''; // Reset lớp nếu là admin
      } else {
        classContainer.classList.remove('hidden');
      }
    });

    // 4. Load dữ liệu và chia 2 bảng
    const tableSV = document.getElementById('table-sv');
    const tableAdmin = document.getElementById('table-admin');
    const countSV = document.getElementById('count-sv');
    const countAdmin = document.getElementById('count-admin');
    
    async function loadUsers() {
      tableSV.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-gray-500">Đang tải dữ liệu...</td></tr>`;
      tableAdmin.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-gray-500">Đang tải dữ liệu...</td></tr>`;
      
      try {
        const querySnapshot = await getDocs(collection(db, "users"));
        
        let htmlSV = "";
        let htmlAdmin = "";
        let numSV = 0;
        let numAdmin = 0;

        querySnapshot.forEach((docSnap) => {
          const user = docSnap.data();
          const date = user.createdAt ? new Date(user.createdAt).toLocaleDateString('vi-VN') : 'N/A';
          
          if(user.role === 'sinh_vien') {
            numSV++;
            const lopStr = user.lop ? `<span class="font-mono text-blue-300">${user.lop}</span>` : '<span class="text-gray-600">-</span>';
            htmlSV += `
              <tr class="hover:bg-gray-750 transition">
                <td class="py-3 px-2 font-mono text-gray-200">${user.msv}</td>
                <td class="py-3 px-2">${lopStr}</td>
                <td class="py-3 px-2 text-gray-400 text-xs">${date}</td>
                <td class="py-3 px-2 text-center">
                  <button onclick="deleteUser('${user.msv}')" class="bg-gray-700 hover:bg-red-600 text-gray-300 hover:text-white text-xs px-3 py-1.5 rounded transition">Xóa</button>
                </td>
              </tr>
            `;
          } 
          else if(user.role === 'admin') {
            numAdmin++;
            const creator = user.createdBy ? `<span class="text-gray-400 text-xs">${user.createdBy}</span>` : '<span class="text-gray-600">-</span>';
            htmlAdmin += `
              <tr class="hover:bg-gray-750 transition">
                <td class="py-3 px-2 font-mono text-red-300 font-semibold">${user.msv}</td>
                <td class="py-3 px-2">${creator}</td>
                <td class="py-3 px-2 text-gray-400 text-xs">${date}</td>
                <td class="py-3 px-2 text-center">
                  <button onclick="deleteUser('${user.msv}')" class="bg-gray-700 hover:bg-red-600 text-gray-300 hover:text-white text-xs px-3 py-1.5 rounded transition">Xóa</button>
                </td>
              </tr>
            `;
          }
        });

        // Cập nhật giao diện
        tableSV.innerHTML = numSV > 0 ? htmlSV : `<tr><td colspan="4" class="text-center py-6 text-gray-500">Chưa có sinh viên nào.</td></tr>`;
        tableAdmin.innerHTML = numAdmin > 0 ? htmlAdmin : `<tr><td colspan="4" class="text-center py-6 text-gray-500">Chưa có Admin nào.</td></tr>`;
        
        countSV.textContent = numSV;
        countAdmin.textContent = numAdmin;

      } catch (error) {
        tableSV.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-red-400">Lỗi: ${error.message}</td></tr>`;
        tableAdmin.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-red-400">Lỗi: ${error.message}</td></tr>`;
      }
    }

    // 5. Hàm Xóa User 
    window.deleteUser = async (msv) => {
      if(msv === session.uid) {
        alert("Master FoxST định tự hủy tài khoản của chính mình sao? Bé Lôi không cho phép đâu nha! 🚫");
        return;
      }
      if(confirm(`Cảnh báo: Bạn có chắc chắn muốn XÓA VĨNH VIỄN tài khoản [${msv}] không?`)) {
        try {
          await deleteDoc(doc(db, "users", msv));
          alert(`Đã xóa tài khoản ${msv} thành công!`);
          loadUsers(); // Tải lại 2 bảng
        } catch (error) {
          alert("Lỗi khi xóa: " + error.message);
        }
      }
    }

    // 6. Xử lý Form Tạo Tài Khoản
    document.getElementById('admin-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const userId = document.getElementById('user-id').value.trim();
      const rawPassword = document.getElementById('user-password').value;
      const selectedRole = roleSelect.value;
      const lop = selectedRole === 'sinh_vien' ? classInput.value.trim() : "";
      const msg = document.getElementById('admin-msg');

      try {
        const secureHash = await processCustomPassword(rawPassword);
        
        await setDoc(doc(db, "users", userId), {
          msv: userId,
          passwordHash: secureHash,
          role: selectedRole,
          lop: lop, 
          createdAt: new Date().toISOString(),
          createdBy: session.uid
        });
        
        msg.textContent = `Tạo thành công: ${userId}`; 
        msg.className = "text-sm text-center mt-3 text-green-400 block"; 
        
        // Reset form và UI
        document.getElementById('admin-form').reset();
        classContainer.classList.remove('hidden'); 
        
        // Tự động load lại bảng danh sách
        loadUsers();
        
        // Ẩn thông báo sau 3s
        setTimeout(() => { msg.classList.add('hidden'); }, 3000);
      } catch (error) {
        msg.textContent = "Lỗi tạo tài khoản!"; 
        msg.className = "text-sm text-center mt-3 text-red-400 block"; 
      }
    });

    // Chạy load dữ liệu lần đầu
    document.getElementById('btn-refresh').addEventListener('click', loadUsers);
    loadUsers();
  </script>
</body>
</html>
