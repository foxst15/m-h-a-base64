<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Hệ Thống QLSV</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-8">
  <div class="max-w-4xl mx-auto">
    <div class="flex justify-between items-center bg-gray-800 p-6 rounded-2xl border border-gray-700 mb-6">
      <h1 class="text-2xl font-bold text-indigo-400">Admin Control Panel 👑</h1>
      <button id="btn-logout" class="bg-red-600 hover:bg-red-500 px-4 py-2 rounded-lg font-medium text-sm">Đăng Xuất</button>
    </div>

    <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 w-full max-w-md">
      <h2 class="text-lg font-semibold mb-4 text-green-400">Tạo Tài Khoản Sinh Viên</h2>
      <form id="admin-form" class="space-y-4">
        <input type="text" id="admin-msv" required placeholder="Nhập MSV..." class="w-full px-4 py-2 bg-gray-700 rounded-lg">
        <input type="text" id="admin-password" required placeholder="Mật khẩu thô..." class="w-full px-4 py-2 bg-gray-700 rounded-lg">
        <button type="submit" class="w-full bg-green-600 hover:bg-green-500 font-semibold py-2 rounded-lg">Tạo Tài Khoản</button>
        <div id="admin-msg" class="text-sm text-center mt-2 font-medium hidden"></div>
      </form>
    </div>
  </div>

  <script type="module">
    // Bảo vệ trang Admin
    const session = JSON.parse(localStorage.getItem('userSession'));
    if (!session || session.role !== 'admin') window.location.href = 'index.html';

    document.getElementById('btn-logout').addEventListener('click', () => {
      localStorage.removeItem('userSession');
      window.location.href = 'index.html';
    });

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const app = initializeApp({
      apiKey: "AIzaSyA6MzA5S1JxABA6PPsiH1dV_JjMpoqkxIM",
      authDomain: "quan-ly-sinh-vien-e3307.firebaseapp.com",
      projectId: "quan-ly-sinh-vien-e3307",
      storageBucket: "quan-ly-sinh-vien-e3307.firebasestorage.app"
    });
    const db = getFirestore(app);

    const map = {'A':'А','B':'В','C':'С','E':'Е','H':'Н','I':'І','J':'Ј','K':'К','M':'М','O':'О','P':'Р','T':'Т','X':'Х','Y':'Ү','a':'а','b':'Ь','c':'с','d':'ԁ','e':'е','f':'𝚏','g':'ɡ','h':'һ','i':'і','j':'ϳ','k':'κ','l':'ⅼ','m':'ｍ','n':'ո','o':'о','p':'р','q':'ԛ','r':'г','s':'ѕ','t':'𝚝','u':'ս','v':'ѵ','w':'ѡ','x':'х','y':'у','z':'z','0':'૦','1':'١','2':'𝟐','3':'𝟯','4':'𝟺','5':'５','6':'б','7':'7','8':'8','9':'9','+':'➕','/':'⧸','=':'🟰'};
    async function processCustomPassword(pw) {
      const base64 = btoa(unescape(encodeURIComponent(pw)));
      const obf = base64.split('').map(c => map[c] || c).join('');
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(obf));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    document.getElementById('admin-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msv = document.getElementById('admin-msv').value.trim();
      const rawPassword = document.getElementById('admin-password').value;
      const msg = document.getElementById('admin-msg');

      try {
        const secureHash = await processCustomPassword(rawPassword);
        await setDoc(doc(db, "users", msv), {
          msv: msv,
          passwordHash: secureHash,
          role: "sinh_vien", // Set role chuẩn cho sinh viên
          createdAt: new Date().toISOString()
        });
        msg.textContent = `Tạo thành công MSV: ${msv}`; msg.className = "text-sm text-center mt-2 text-green-400"; msg.classList.remove('hidden');
      } catch (error) {
        msg.textContent = "Lỗi tạo tài khoản!"; msg.className = "text-sm text-center mt-2 text-red-400"; msg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
