<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Cổng Thông Tin Sinh Viên</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex">

  <!-- SIDEBAR MENU -->
  <aside class="w-64 bg-gray-800 border-r border-gray-700 flex flex-col hidden md:flex">
    <div class="p-6 border-b border-gray-700 text-center">
      <h2 class="text-2xl font-bold text-indigo-400">QLSV<span class="text-white"> PDU</span></h2>
    </div>
    <nav class="flex-1 p-4 space-y-2">
      <a href="#" class="block px-4 py-2.5 bg-indigo-600 text-white rounded-lg font-medium">Trang Chủ</a>
      <a href="#" class="block px-4 py-2.5 text-gray-400 hover:bg-gray-700 hover:text-white rounded-lg transition">Xem Điểm</a>
      <a href="#" class="block px-4 py-2.5 text-gray-400 hover:bg-gray-700 hover:text-white rounded-lg transition">Lịch Học</a>
      <a href="#" class="block px-4 py-2.5 text-gray-400 hover:bg-gray-700 hover:text-white rounded-lg transition">Học Phí</a>
    </nav>
    <div class="p-4 border-t border-gray-700">
      <button id="btn-logout" class="w-full flex items-center justify-center space-x-2 bg-red-600 hover:bg-red-500 text-white font-semibold py-2.5 rounded-lg transition">
        <span>Đăng Xuất</span>
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="flex-1 flex flex-col h-screen overflow-y-auto">
    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-6 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-gray-100">Tổng Quan Sinh Viên</h1>
        <p class="text-sm text-gray-400">Chào mừng bạn quay trở lại cổng thông tin!</p>
      </div>
      <div class="flex items-center space-x-3">
        <div class="text-right hidden sm:block">
          <p id="header-msv" class="font-bold text-indigo-400">Đang tải...</p>
          <p class="text-xs text-gray-400">Sinh Viên</p>
        </div>
        <div class="h-10 w-10 rounded-full bg-indigo-500 flex items-center justify-center font-bold text-lg">
          S
        </div>
      </div>
    </header>

    <!-- Content Cards -->
    <div class="p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Card Thông Tin -->
      <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 col-span-1 lg:col-span-2">
        <h3 class="text-lg font-semibold text-indigo-300 mb-4">Thông Tin Cá Nhân</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="bg-gray-700 p-4 rounded-lg">
            <p class="text-sm text-gray-400">Mã Sinh Viên</p>
            <p id="card-msv" class="text-lg font-mono font-bold text-white mt-1">Đang tải...</p>
          </div>
          <div class="bg-gray-700 p-4 rounded-lg">
            <p class="text-sm text-gray-400">Trạng Thái</p>
            <p class="text-lg font-bold text-green-400 mt-1">Đang Học</p>
          </div>
          <div class="bg-gray-700 p-4 rounded-lg">
            <p class="text-sm text-gray-400">Lớp Sinh Hoạt</p>
            <p class="text-lg font-bold text-white mt-1">DCT23AB</p>
          </div>
          <div class="bg-gray-700 p-4 rounded-lg">
            <p class="text-sm text-gray-400">Khoa</p>
            <p class="text-lg font-bold text-white mt-1">Công Nghệ Thông Tin</p>
          </div>
        </div>
      </div>

      <!-- Card Đổi Mật Khẩu -->
      <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700">
        <h3 class="text-lg font-semibold text-amber-400 mb-4">Bảo Mật - Đổi Mật Khẩu</h3>
        <form id="change-pwd-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1 text-gray-300">Mật khẩu hiện tại</label>
            <input type="password" id="old-pwd" required class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1 text-gray-300">Mật khẩu mới</label>
            <input type="password" id="new-pwd" required class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none text-sm">
          </div>
          <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 font-semibold py-2.5 rounded-lg transition mt-2 text-sm">
            Xác Nhận Đổi Mật Khẩu
          </button>
          <div id="pwd-msg" class="text-sm text-center mt-2 font-medium hidden"></div>
        </form>
      </div>

    </div>
  </main>

  <!-- SCRIPT -->
  <script type="module">
    // 1. Kiểm tra Session bảo mật
    const session = JSON.parse(localStorage.getItem('userSession'));
    if (!session || session.role !== 'sinh_vien') {
      window.location.href = 'index.html'; // Đá văng nếu không phải sinh viên
    } else {
      // Hiển thị MSV lên giao diện
      document.getElementById('header-msv').textContent = session.uid;
      document.getElementById('card-msv').textContent = session.uid;
    }

    // Nút đăng xuất
    document.getElementById('btn-logout').addEventListener('click', () => {
      localStorage.removeItem('userSession');
      window.location.href = 'index.html';
    });

    // 2. Cấu hình Firebase & Thuật toán
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const app = initializeApp({
      apiKey: "AIzaSyA6MzA5S1JxABA6PPsiH1dV_JjMpoqkxIM",
      authDomain: "quan-ly-sinh-vien-e3307.firebaseapp.com",
      projectId: "quan-ly-sinh-vien-e3307",
      storageBucket: "quan-ly-sinh-vien-e3307.firebasestorage.app"
    });
    const db = getFirestore(app);

    // Thuật toán băm mật khẩu
    const map = {'A':'А','B':'В','C':'С','E':'Е','H':'Н','I':'І','J':'Ј','K':'К','M':'М','O':'О','P':'Р','T':'Т','X':'Х','Y':'Ү','a':'а','b':'Ь','c':'с','d':'ԁ','e':'е','f':'𝚏','g':'ɡ','h':'һ','i':'і','j':'ϳ','k':'κ','l':'ⅼ','m':'ｍ','n':'ո','o':'о','p':'р','q':'ԛ','r':'г','s':'ѕ','t':'𝚝','u':'ս','v':'ѵ','w':'ѡ','x':'х','y':'у','z':'z','0':'૦','1':'١','2':'𝟐','3':'𝟯','4':'𝟺','5':'５','6':'б','7':'7','8':'8','9':'9','+':'➕','/':'⧸','=':'🟰'};
    async function processCustomPassword(pw) {
      const base64 = btoa(unescape(encodeURIComponent(pw)));
      const obf = base64.split('').map(c => map[c] || c).join('');
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(obf));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // 3. Xử lý đổi mật khẩu
    document.getElementById('change-pwd-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const oldPwd = document.getElementById('old-pwd').value;
      const newPwd = document.getElementById('new-pwd').value;
      const msg = document.getElementById('pwd-msg');

      if(oldPwd === newPwd) {
        msg.textContent = "Mật khẩu mới phải khác mật khẩu cũ!"; 
        msg.className = "text-sm text-center mt-2 text-red-400 block";
        return;
      }

      try {
        const userRef = doc(db, "users", session.uid);
        const userSnap = await getDoc(userRef);

        if (userSnap.exists()) {
          const currentHashInDB = userSnap.data().passwordHash;
          const oldPwdHash = await processCustomPassword(oldPwd);

          // Kiểm tra mật khẩu cũ có đúng không
          if (oldPwdHash !== currentHashInDB) {
            msg.textContent = "Mật khẩu hiện tại không đúng!";
            msg.className = "text-sm text-center mt-2 text-red-400 block";
            return;
          }

          // Băm mật khẩu mới và cập nhật lên Firestore
          const newPwdHash = await processCustomPassword(newPwd);
          await updateDoc(userRef, {
            passwordHash: newPwdHash
          });

          msg.textContent = "Đổi mật khẩu thành công!";
          msg.className = "text-sm text-center mt-2 text-green-400 block";
          document.getElementById('change-pwd-form').reset(); // Xóa trắng form

        }
      } catch (error) {
        msg.textContent = "Lỗi kết nối CSDL!";
        msg.className = "text-sm text-center mt-2 text-red-400 block";
      }
    });
  </script>
</body>
</html>
