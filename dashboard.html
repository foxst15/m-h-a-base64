<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Sinh Viên</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-700 text-center space-y-6">
    
    <div>
      <h2 class="text-3xl font-bold text-indigo-400 mb-2">Trang Cá Nhân</h2>
      <p class="text-gray-300">Chào mừng Sinh Viên</p>
      <div id="student-id" class="text-xl font-mono text-green-400 mt-2 bg-gray-700 inline-block px-4 py-1 rounded-lg">Đang tải...</div>
    </div>

    <div class="pt-6 border-t border-gray-700">
      <p class="text-sm text-gray-400 mb-4">Master FoxST có thể thêm các chức năng xem điểm, lịch học tại đây nha!</p>
      <button id="btn-logout" class="w-full bg-red-600 hover:bg-red-500 font-semibold py-2 rounded-lg transition">
        Đăng Xuất
      </button>
    </div>

  </div>

  <script>
    // Bảo vệ trang Dashboard
    const session = JSON.parse(localStorage.getItem('userSession'));
    if (!session || session.role !== 'sinh_vien') {
      window.location.href = 'index.html';
    } else {
      document.getElementById('student-id').textContent = `MSV: ${session.uid}`;
    }

    // Đăng xuất
    document.getElementById('btn-logout').addEventListener('click', () => {
      localStorage.removeItem('userSession');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
